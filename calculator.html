<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
<form action="calculator" method="get" style = "color: red; background-color: rgb(118, 205, 97);"></form>

<label for="first_value">First Value :

</label><br>


<input type="text" name="first_value" placeholder="Enter your  first value"><br><br> 

            
     <label for="Sec_value">Second Value :</label><br>
     <input type="text" name="Sec_value" placeholder="Enter your second value"><br><br>
     <input type="radio" name="operation" checked value="+">+,
     <input type="radio" name="operation" checked value="-">-,
     <input type="radio" name="operation" checked value="*">*,
     <input type="radio" name="operation" checked value="/">/,
     <input type="radio" name="operation" checked value="%">%<br>
     <br>
     <button type="submit">Calculate</button><br>
     <br><br>
     
</body>
</html>
